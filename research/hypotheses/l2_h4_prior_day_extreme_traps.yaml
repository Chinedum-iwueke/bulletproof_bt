hypothesis_id: "L2-H4"
title: "Prior-Day High/Low Liquidity-Level Traps"
description: "Breakout attempts into strictly closed prior-day extremes should bifurcate by regime: high-vol states continue, while compression states mean-revert after rejection."
research_layer: "L2"
hypothesis_family: "prior_day_extreme_traps"
version: "1.0.0"
author: "bulletproof_bt"
created_at: "2026-07-10T00:00:00Z"

required_indicators:
  - atr
  - historical_vol

indicator_defaults:
  signal_timeframe: "5m"
  daily_reference_timeframe: "1d"
  atr_period: 14
  volatility_percentile_window: "30d"
  compression_window_days: 30
  base_execution_timeframe: "1m"

gates:
  - field: "has_prior_day_level"
    op: "=="
    value: true
  - field: "regime_chosen"
    op: "in"
    value: ["high_vol_breakout", "compression_fade"]
  - field: "distance_to_nearest_level"
    op: "<="
    param: "epsilon_atr"

parameter_grid:
  epsilon_atr: [0.25, 0.5]
  delta_atr: [0.1, 0.2]
  k_atr: [2.0, 2.5]
  signal_timeframe: ["5m"]
  theta_vol: [0.70]
  q_comp: [0.20]
  T_hold: [12]
  use_compiled_features: [false]
  family_variant: ["L2-H4"]

entry:
  strategy: "l2_h4_prior_day_extreme_traps"
  signal_timeframe: "5m"
  timeframe: "5m"
  base_execution_timeframe: "1m"
  order_timing: "bar_close_submit_next_bar_execution"
  disallow_flip: true
  no_pyramiding: true
  one_attempt_per_day_per_symbol: true

exit:
  stop_kind: "atr_multiple"
  stop_model: "fixed_atr_multiple"
  stop_atr_param: "k_atr"
  stop_update_policy: "frozen_at_entry"
  atr_source_timeframe: "signal_timeframe"
  time_stop_param: "T_hold"
  hold_time_unit: "signal_bars"
  exit_monitoring_timeframe: "1m"
  take_profit:
    enabled: false

execution_semantics:
  signal_timeframe: "5m"
  htf_timeframes: ["5m", "1d"]
  base_execution_timeframe: "1m"
  exit_monitoring_timeframe: "1m"
  base_data_frequency_expected: "1m"
  strategy_family: "prior_day_extreme_traps"
  family_pattern: "strict_closed_1d_pdh_pdl_regime_switched_breakout_or_rejection"
  daily_reference: "strict_closed_1d"
  stop_model: "fixed_atr_multiple"
  stop_update_policy: "frozen_at_entry"
  tp_update_policy: "disabled"
  hold_time_unit: "signal_bars"
  atr_source_timeframe: "signal_timeframe"
  risk_accounting: "engine_canonical_R"
  no_pyramiding: true
  one_attempt_per_day_per_symbol: true

sizing:
  mode: risk_at_stop
  r_per_trade: 0.005
  cap_policy: allow_clip_with_truth
  min_risk_utilization_pct: 0.10
  report_under_risked_trades: true

risk_controls:
  max_positions: 5
  max_leverage: 1.0
  max_notional_pct_equity: 0.5
  max_gross_notional_pct_equity: 0.5
  disallow_flip: true
  no_pyramiding: true
  one_attempt_per_day_per_symbol: true
  unresolved_stops: reject
  forced_liquidation_expected: false

data_assumptions:
  dataset_kind: research_panel
  universes: ["stable", "volatile"]
  required_columns: ["ts", "open", "high", "low", "close", "volume"]
  optional_rich_columns:
    - funding_rate
    - funding_source_ts
    - open_interest
    - oi_source_ts
    - mark_close
    - index_close
    - premium_mark_vs_index
    - basis_close_vs_index
  rich_data_role: "logging_only_context"
  ohlcv_only_fallback: true
  pdh_pdl_contract: "PDH and PDL are sourced only from strict completed 1d bars emitted after the day closes."

evaluation:
  required_tiers: ["Tier2", "Tier3"]
  metrics:
    - ev_r_net
    - ev_r_gross
    - conditional_ev_high_vol_breakout
    - conditional_ev_compression_fade
    - ev_monotonicity_vs_vol_pctile_buckets
    - trade_count
    - max_drawdown
    - drawdown_duration
    - under_risked_trade_rate

logging:
  schema_version: "1.0"
  required_fields:
    - run_id
    - hypothesis_id
    - tier
    - ev_r_gross
    - ev_r_net
    - status
    - pdh
    - pdl
    - prior_day_anchor_id
    - distance_to_pdh
    - distance_to_pdl
    - distance_to_nearest_level
    - epsilon_atr
    - delta_atr
    - regime_chosen
    - trigger_type
    - high_vol_gate_t
    - comp_gate_t
    - vol_pct_t
    - rv_t
    - attempt_day_id
    - one_attempt_per_day
    - entry_reason
    - stop_distance
    - risk_amount
    - risk_budget
    - requested_risk_amount
    - risk_utilization_pct
    - under_risked_trade
    - entry_state_mark_price
    - entry_state_index_price
    - entry_state_funding_raw
    - entry_state_oi_level
    - entry_state_basis_raw
    - entry_decision_conditions_json
    - entry_decision_gate_values_json

runtime_controls:
  enabled: true
  tags: ["pdh_pdl", "liquidity_levels", "regime_switch", "breakout", "mean_reversion"]
  notes: "High-vol gate selects continuation breakouts; compression gate selects rejection fades. If only one branch works, preserve the minimal branch."

falsification_criteria:
  - "If conditional EV does not bifurcate by high-vol versus compression regimes, scrap the regime-switch thesis."
  - "If only one branch has positive robust EV, keep that branch and remove the other."
  - "If level effects vanish outside one exchange/universe, classify as venue-specific and do not promote broadly."

expected_failure_modes:
  - "Prior-day levels may be too widely watched and arbitraged away in aggregate."
  - "Breakout continuation may only work during broad beta regimes."
  - "Compression fades may become falling-knife entries during hidden liquidation cascades."
  - "Daily reference effects may vary by exchange due to venue-specific participant behavior."

truth_contract:
  version: "1.0"
  profile: production
  no_lookahead: true
  strict_utc: true
  missing_bars: no_decision
  interpolation: forbidden
  htf_completeness: closed_only
  aux_join_direction: backward
  execution_authority: engine
  risk_authority: engine
  accounting: engine_canonical_R
  truth_gate_required: true
  parity_required_for_fast_path: true
  research_memory_requires_certification: true
