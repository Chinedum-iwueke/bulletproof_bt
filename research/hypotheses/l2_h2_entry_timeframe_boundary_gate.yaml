hypothesis_id: "L2-H2"
title: "Entry-Timeframe Boundary Gating Reduces Noise Trades"
description: "Restricting entries to deterministic higher-timeframe boundaries should reduce mid-bar micro-noise entries, lower turnover, and improve net EV while preserving 1m exit monitoring."
research_layer: "L2"
hypothesis_family: "entry_timeframe_boundary_gate"
version: "1.0.0"
author: "bulletproof_bt"
created_at: "2026-07-10T00:00:00Z"

required_indicators:
  - ema
  - atr
  - historical_vol

indicator_defaults:
  signal_timeframe: "1m"
  atr_period: 14
  ema_fast_period: 20
  ema_slow_period: 50
  volatility_percentile_window: "30d"
  base_execution_timeframe: "1m"

gates:
  - field: "allow_entries"
    op: "=="
    value: true
  - field: "entry_timeframe_boundary"
    op: "=="
    value: true

parameter_grid:
  entry_timeframe: ["none", "5m", "15m", "1h"]
  signal_timeframe: ["1m"]
  theta_vol: [0.70]
  k_atr: [2.0]
  T_hold: [24]
  tp_enabled: [false]
  m_atr: [2.0]
  use_compiled_features: [false]
  family_variant: ["L2-H2"]

entry:
  strategy: "l1_h1_vol_floor_trend"
  signal_timeframe: "1m"
  timeframe: "1m"
  entry_timeframe: "from_grid"
  base_execution_timeframe: "1m"
  order_timing: "bar_close_submit_next_bar_execution"
  disallow_flip: true
  no_pyramiding: true
  gate_adapter: "EntryTimeframeGate"

exit:
  stop_kind: "atr_multiple"
  stop_model: "fixed_atr_multiple"
  stop_atr_param: "k_atr"
  stop_update_policy: "frozen_at_entry"
  atr_source_timeframe: "signal_timeframe"
  time_stop_param: "T_hold"
  hold_time_unit: "signal_bars"
  exit_monitoring_timeframe: "1m"
  take_profit:
    enabled: false

execution_semantics:
  signal_timeframe: "1m"
  htf_timeframes: ["1m"]
  base_execution_timeframe: "1m"
  exit_monitoring_timeframe: "1m"
  base_data_frequency_expected: "1m"
  strategy_family: "entry_timeframe_boundary_gate"
  family_pattern: "boundary_gate_adapter_on_ltf_vol_floor_trend_control_signal"
  gate_semantics: "entry signals only; exits are never boundary-gated"
  stop_model: "fixed_atr_multiple"
  stop_update_policy: "frozen_at_entry"
  tp_update_policy: "disabled"
  hold_time_unit: "signal_bars"
  atr_source_timeframe: "signal_timeframe"
  risk_accounting: "engine_canonical_R"
  no_pyramiding: true

sizing:
  mode: risk_at_stop
  r_per_trade: 0.005
  cap_policy: allow_clip_with_truth
  min_risk_utilization_pct: 0.10
  report_under_risked_trades: true

risk_controls:
  max_positions: 5
  max_leverage: 1.0
  max_notional_pct_equity: 0.5
  max_gross_notional_pct_equity: 0.5
  disallow_flip: true
  unresolved_stops: reject
  forced_liquidation_expected: false

data_assumptions:
  dataset_kind: research_panel
  universes: ["stable", "volatile"]
  required_columns: ["ts", "open", "high", "low", "close", "volume"]
  optional_rich_columns:
    - funding_rate
    - funding_source_ts
    - open_interest
    - oi_source_ts
    - mark_close
    - index_close
    - premium_mark_vs_index
    - basis_close_vs_index
  rich_data_role: "logging_only_context"
  ohlcv_only_fallback: true
  entry_gate_context: "EntryTimeframeGate uses UTC timestamp boundary checks only; no market-data lookahead is introduced."

evaluation:
  required_tiers: ["Tier2", "Tier3"]
  metrics:
    - ev_r_net
    - ev_r_gross
    - turnover_reduction_vs_none
    - trade_count_reduction_vs_none
    - cost_breakdown_sensitivity
    - max_drawdown
    - drawdown_duration
    - win_rate
    - under_risked_trade_rate

logging:
  schema_version: "1.0"
  required_fields:
    - run_id
    - hypothesis_id
    - tier
    - ev_r_gross
    - ev_r_net
    - status
    - entry_timeframe
    - entry_timeframe_gate_applied
    - allow_entries
    - entry_timeframe_boundary
    - entry_timeframe_gate_blocked
    - entry_signal_ts
    - entry_reason
    - stop_distance
    - risk_amount
    - risk_budget
    - requested_risk_amount
    - risk_utilization_pct
    - under_risked_trade
    - entry_state_mark_price
    - entry_state_index_price
    - entry_state_funding_raw
    - entry_state_oi_level
    - entry_state_basis_raw
    - entry_decision_conditions_json
    - entry_decision_gate_values_json
  adapter_artifacts:
    - entry_timeframe_gate.json

runtime_controls:
  enabled: true
  tags: ["entry_gate", "boundary", "turnover_control", "research_panel"]
  notes: "The 'none' row is the ungated control. 5m, 15m, and 1h rows activate EntryTimeframeGate through data.entry_timeframe."

falsification_criteria:
  - "If gated variants reduce turnover but materially reduce net EV without drawdown or cost improvements, boundary gating is undertrading rather than denoising."
  - "If gains exist only at the 1h boundary because trade count collapses, treat the result as sample-starved unless Tier3 confirms."
  - "If cost savings do not explain any net-EV uplift, inspect whether the gate is accidentally timing a specific regime rather than filtering micro-noise."

expected_failure_modes:
  - "Boundary gating misses fast moves that begin between boundaries."
  - "The ungated control may outperform if the underlying signal's edge depends on immediate reaction."
  - "Trade count may be too low for 1h gating on sparse volatile memberships."

truth_contract:
  version: "1.0"
  profile: production
  no_lookahead: true
  strict_utc: true
  missing_bars: no_decision
  interpolation: forbidden
  htf_completeness: closed_only
  aux_join_direction: backward
  execution_authority: engine
  risk_authority: engine
  accounting: engine_canonical_R
  truth_gate_required: true
  parity_required_for_fast_path: true
  research_memory_requires_certification: true
