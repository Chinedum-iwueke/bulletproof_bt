  target: BTCUSDT close-to-close return from the decision boundary to exactly 60 minutes later
  time_exit_minutes: 60
  stop_kind: fixed_3pct_from_completed_close
  stop_update_policy: frozen_at_entry
sizing: {mode: risk_at_stop, r_per_trade: 0.005, cap_policy: allow_clip_with_truth, min_risk_utilization_pct: 0.10, report_under_risked_trades: true}
risk: {authority: engine, max_positions: 1, max_notional_pct_equity: 0.25, max_gross_notional_pct_equity: 0.25, max_leverage: 1.0, unresolved_stop_policy: reject_entry, pyramiding: false, flips: false}
costs: {authority: engine, taker_fee_bps: 6.0, slippage_bps: 2.0, spread_bps: 1.0, delay_bars: 1, robustness_multiplier: 2.0}
data_availability:
  dataset_kind: research_panel
  auxiliary_fields_role: required_signal_input
  ohlcv_only_fallback: no_decision
  missing_auxiliary: no_decision
  liquidity_floor_usd: 1000000.0
execution_semantics:
  resampling_interval: left_closed_right_open
  resampling_label: bucket_start
  signal_timeframe: 5m
  base_execution_timeframe: 1m
  base_data_frequency_expected: 1m
  exit_monitoring_timeframe: 1m
  signal_bar_policy: strict_completed_bar_only
  stop_model: fixed_3pct_from_completed_close
  stop_update_policy: frozen_at_entry
  tp_update_policy: none
  hold_time_unit: wall_clock_minutes_after_signal_close
  atr_source_timeframe: 5m
  required_extra_columns: [quote_volume, mark_close, index_close, funding_rate, funding_source_ts, basis_close_vs_index]
  risk_accounting: engine_canonical_R
evaluation:
  required_tiers: [Tier2B]
  metrics: [matched_support, treated_support, control_support, treated_minus_control_mean, confidence_interval_95, doubled_cost_treated_minus_control, maximum_drawdown]
  split: {method: chronological_decision_row_fraction, train_fraction: 0.60, validation_fraction: 0.20, test_fraction: 0.20, boundary_policy: next_row_after_prior_partition, purge_seconds: 3600, embargo_seconds: 3600}
  selection_metric: validation_treated_minus_control_mean
  confidence_interval_method: overlap_component_cluster_robust_60m
  outcome_retention: [positive, negative, invalid, failed]
  native_implementation:
    matched_control: {path: src/bt/strategy/btc_funding_basis_crowding_60m.py, function: funding_basis_matched_evaluation}
falsification_criteria:
  - Reject unless the held-out stressed-minus-control mean next-60m return has its preregistered 95% confidence interval entirely below zero.
  - Reject if treated or matched-control support is below 30, or either trailing-return direction has fewer than 10 treated observations.
  - Reject every decision with an incomplete 5m bucket, missing quote_volume, quote_volume below USD 1,000,000, a non-contiguous 60m target, or future funding_source_ts.
  - Reject if the effect disappears after matching on past 60m return, past 6h realized volatility and UTC funding-cycle position.
  - Reject if the held-out doubled-cost treated-minus-control difference is not negative.
expected_failure_modes: [trend continuation, funding-cycle confounding, volatility-regime confounding, microstructure bounce, transaction-cost sensitivity]
logging:
  schema_version: "1.0"
