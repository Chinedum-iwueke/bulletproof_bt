falsification_criteria:
  - "Reject if held-out return signed opposite to the signal-bar direction is nonpositive after registered costs."
  - "Reject if the result is indistinguishable from the preregistered control matched on absolute signal-bar return but not impact-proxy extremity."
  - "Reject if reversal is confined to one direction without preregistered asymmetric support."
  - "Reject if held-out trade support is below 50 or doubled-cost mean net R is nonpositive."
  - "Reject observations whose completed signal-bar quote_volume is below USD 1,000,000."
expected_failure_modes:
  - "The displacement reflects informed flow and continues."
  - "Volatility clustering explains subsequent moves without reversal."
  - "Broad market movement rather than transient liquidity stress generated the signal."
  - "The ratio is driven by low quote volume or measurement error."
