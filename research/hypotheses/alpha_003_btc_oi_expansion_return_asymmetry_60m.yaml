falsification_criteria:
  - Reject if either positive-return or negative-return treated direction has fewer than 30 held-out matched observations after the USD 1,000,000 completed-bar liquidity gate.
  - Reject unless the selected held-out direction-adjusted interaction has a preregistered 95% confidence interval entirely above zero.
  - Reject if the effect is absent after deterministic no-reuse matching on past 60m return, past 6h realized volatility, UTC funding-cycle position, and 15m quote_volume.
  - Reject unless the paired actual-minus-one-additional-15m-lag OI placebo confidence interval is entirely above zero on identical treated/control timestamps.
  - Reject if the held-out effect is nonpositive under doubled registered costs.
  - Reject every incomplete constituent window, non-contiguous target, missing required schema value, missing OI/liquidity value, or OI source timestamp later than the decision.
expected_failure_modes: [informed-flow continuation, crowded-position reversal, volatility clustering, broad directional beta, funding-cycle confounding, stale open interest, microstructure noise]
