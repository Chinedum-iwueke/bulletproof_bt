representation_plan: &plan
  schema_version: adaptive-representation-plan-v1.0.0
  candidate_key: btc-oi-expansion-return-asymmetry-60m
  instruments: [BTCUSDT]
  basket_members:
    - instrument: BTCUSDT
      role: primary
      legacy_groups: [stable]
      selection_rationale: The frozen candidate is a single-instrument BTCUSDT hypothesis, and the admitted Bybit panel supplies its price, quote-volume, open-interest, and source-timestamp fields. No additional asset is causally necessary.
  source_timeframe: 1m
  research_timeframe: 15m
  resampling_policy: left_closed_left_labeled_complete_bars
  transformations:
    - output_field: btc_15m_log_return
      operation: log_return
      input_fields: [BTCUSDT__close]
      parameters: {periods: 1}
      fit_policy: stateless
      rationale: Provides the scale-safe signed completed-15m price displacement used in the interaction predictor.
    - output_field: btc_past_60m_log_return
      operation: log_return
      input_fields: [BTCUSDT__close]
      parameters: {periods: 4}
      fit_policy: stateless
      rationale: Provides the preregistered trailing-60m return control using only information available at the decision boundary.
    - output_field: btc_past_6h_realized_volatility
      operation: realized_volatility
      input_fields: [btc_15m_log_return]
      parameters: {window: 24}
      fit_policy: stateless
      rationale: Measures the stipulated past-6h volatility control from 24 completed 15m returns without imposing directional meaning.
    - output_field: btc_15m_quote_volume
      operation: identity
      input_fields: [BTCUSDT__quote_volume]
      parameters: {}
      fit_policy: stateless
      rationale: Preserves the completed-bar summed USD quote-volume measurement needed to enforce the USD 1,000,000 gate.
  transformation_rationale: Aggregate only contiguous, complete 1m observations into left-closed, left-labeled 15m bars. Use one-bar log return for the signed displacement, four-bar log return for the preregistered past-60m control, 24-bar realized volatility for the past-6h control, and summed 15m quote_volume for the USD 1,000,000 gate. Open interest and oi_source_ts remain governed native auxiliary inputs and are intentionally excluded from the compiler graph; the evaluator must form the point-in-time 15m open-interest log change only from observations satisfying oi_source_ts <= decision time. Missing constituent bars, quote_volume, open_interest, or valid source timing produce no decision.
  rejected_alternatives:
    - Adding ETHUSDT or SOLUSDT controls was rejected because the question is BTC-specific and those panels are catalog-visible but unadmitted.
    - A 5m representation was rejected because it would add microstructure noise and variants without changing the frozen 15m predictor.
    - A 1h representation was rejected because it would collapse the four-bar 60m target and obscure the stipulated 15m return/open-interest interaction.
    - Fractional differentiation was rejected because the predictor and target are finite-horizon returns, so persistence in the price level is neither required nor desirable; simple returns were also rejected in favor of additive, scale-safe log returns.
    - Rolling z-scores and cross-sectional ranks were rejected because the hypothesis preregisters percentile gates handled by the governed strategy/evaluator and has no cross-sectional basket.
    - Price-range liquidity proxies and raw volume were rejected because admitted quote_volume directly measures the required USD liquidity floor.
  selection_data_boundary: metadata_predictors_only_no_targets
  outcome_data_consulted: false
