falsification_criteria:
  - Reject if the held-out association between either preregistered signed-impact shock category and next-3h realized volatility is zero or reverses sign.
  - Reject the directional-asymmetry mechanism if the conditional positive and negative shock effects are statistically indistinguishable at 95% confidence.
  - Reject if either effect disappears after jointly controlling for absolute current return, prior volatility, and completed-bar quote_volume.
  - Exclude decisions lacking six contiguous future 30m bars or USD 1,000,000 completed quote_volume; reject if either shock direction has fewer than 40 held-out observations.
  - Reject if the minimum conditional shock effect is nonpositive after exactly doubled registered costs.
