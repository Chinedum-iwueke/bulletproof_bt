representation_plan: &plan
  basket_members:
    - instrument: XRPUSDT
      legacy_groups: [stable]
      role: primary
      selection_rationale: The raw candidate is single-asset and XRPUSDT alone is causally sufficient for its signed liquidity-impact predictor and future-volatility target; adding market controls would change the frozen question.
  candidate_key: xrp-30m-signed-illiquidity-future-volatility
  instruments: [XRPUSDT]
  outcome_data_consulted: false
  rejected_alternatives:
    - BTCUSDT was rejected because substituting the extensively researched BTC instrument would change the supplied XRPUSDT question and duplicate prior liquidity-impact coverage.
    - Adding BTCUSDT as a broad-market control was rejected because the frozen candidate specifies a single-asset conditional design and the smallest causally sufficient basket is XRPUSDT alone.
    - 5m and 15m clocks were rejected because they do not match the candidate's 30m information-arrival process and would re-enter overused short-horizon liquidity-impact territory.
    - 'Raw close levels and fractional differentiation were rejected: log returns are scale-safe and directly match the frozen predictor and target, while persistent price-level memory is not the proposed mechanism.'
    - Rolling z-score normalization was rejected because the hypothesis requires a past-only tail category governed by the evaluator; replacing it with a z-score would change the predictor.
    - Simple returns were rejected in favor of additive log returns across the six-bar target horizon.
  resampling_policy: left_closed_left_labeled_complete_bars
  research_timeframe: 30m
  schema_version: adaptive-representation-plan-v1.0.0
  selection_data_boundary: metadata_predictors_only_no_targets
  source_timeframe: 1m
  transformation_rationale: Aggregate only complete left-closed, left-labeled 30m bars. Represent price movement as scale-safe log returns, retain completed quote_volume as the USD-liquidity measurement enforcing the floor, and form signed return per quote_volume directly. The 12-bar realized-volatility control covers the prior 6h on this clock. Tail categorization, shock-sign separation, strict prior-only 30-day ranking, and the six-contiguous-bar future target remain governed evaluator operations because the native graph lacks a time-series rolling-percentile operation.
  transformations:
    - {fit_policy: stateless, input_fields: [XRPUSDT__quote_volume], operation: identity, output_field: xrpusdt_quote_volume_30m, parameters: {}, rationale: 'Preserves completed 30m USD quote turnover for the USD 1,000,000 liquidity floor and denominator of the signed-impact predictor.'}
    - {fit_policy: stateless, input_fields: [XRPUSDT__volume], operation: identity, output_field: xrpusdt_volume_30m, parameters: {}, rationale: Retains the candidate-required base-volume measurement as a diagnostic liquidity field without using it to select outcomes.}
    - {fit_policy: stateless, input_fields: [XRPUSDT__close], operation: log_return, output_field: xrpusdt_log_return_30m, parameters: {periods: 1}, rationale: Produces the completed signed 30m close-to-close return using only information available at the decision boundary.}
    - {fit_policy: stateless, input_fields: [xrpusdt_log_return_30m, xrpusdt_quote_volume_30m], operation: ratio, output_field: xrpusdt_signed_impact_30m, parameters: {}, rationale: Implements the named signed return-per-quote_volume predictor; nonpositive or missing quote_volume must yield no decision.}
    - {fit_policy: stateless, input_fields: [xrpusdt_log_return_30m], operation: realized_volatility, output_field: xrpusdt_realized_volatility_6h, parameters: {window: 12, lag: 1}, rationale: Supplies the preregistered prior-6h volatility control from the 12 completed 30m returns ending before the decision bar; the current decision return is separately available for shock-magnitude control.}
