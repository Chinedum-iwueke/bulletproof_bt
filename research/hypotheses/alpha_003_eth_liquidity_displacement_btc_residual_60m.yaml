falsification_criteria:
  - Reject if either instrument lacks at least 365 days of independently content-admitted point-in-time 1m data.
  - Reject any decision unless all 15 constituent 1m quote_volume observations for both instruments are present, nonnegative, sum to at least USD 1,000,000 per instrument, and form complete contiguous 15m bars.
  - Reject if the held-out extreme-minus-matched-control mean signed BTCUSDT residual return has a preregistered 95% confidence interval containing zero.
  - Reject if held-out support is below 50 extreme observations or below 30 one-to-one no-reuse matched controls.
  - Reject if neither preregistered direction has positive held-out mean signed residual return after registered costs and doubled-cost stress.
  - Reject if the effect disappears after controlling with decision-time BTCUSDT 15m return and prior-only BTCUSDT realized volatility, or is confined to one outcome-selected universe or threshold.
