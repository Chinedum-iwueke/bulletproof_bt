representation_plan: &plan
  schema_version: adaptive-representation-plan-v1.0.0
  candidate_key: btc-eth-liquidity-transmission-60m
  instruments: [BTCUSDT, ETHUSDT]
  basket_members:
    - instrument: BTCUSDT
      legacy_groups: [stable]
      role: primary
      selection_rationale: Primary target instrument; Bybit BTCUSDT is content-admitted and supplies the future 60m return, contemporaneous-return control, prior-only volatility control, and its own liquidity gate.
    - instrument: ETHUSDT
      legacy_groups: [stable]
      role: predictor
      selection_rationale: Smallest causally sufficient cross-asset predictor; Bybit ETHUSDT is catalog-visible with more than 365 days of reported 1m history but requires independent content-bound admission before execution.
  source_timeframe: 1m
  research_timeframe: 15m
  resampling_policy: left_closed_left_labeled_complete_bars
  transformations:
    - {fit_policy: stateless, input_fields: [ETHUSDT__close], operation: log_return, output_field: eth_15m_log_return, parameters: {periods: 1}, rationale: "Scale-safe completed-bar ETH innovation; its sign defines continuation-versus-reversal orientation."}
    - {fit_policy: stateless, input_fields: [BTCUSDT__close], operation: log_return, output_field: btc_15m_log_return, parameters: {periods: 1}, rationale: Decision-time BTC return control and causal input for the volatility control.}
    - {fit_policy: stateless, input_fields: [ETHUSDT__quote_volume], operation: identity, output_field: eth_15m_quote_volume, parameters: {}, rationale: "Preserves the completed 15m quote-volume sum used both as the ETH liquidity denominator and to enforce the USD 1,000,000 floor."}
    - {fit_policy: stateless, input_fields: [BTCUSDT__quote_volume], operation: identity, output_field: btc_15m_quote_volume, parameters: {}, rationale: "Preserves the completed 15m BTC quote-volume sum required to enforce the separate USD 1,000,000 liquidity floor."}
    - {fit_policy: stateless, input_fields: [eth_15m_log_return, eth_15m_quote_volume], operation: ratio, output_field: eth_15m_signed_liquidity_displacement, parameters: {}, rationale: "Causal signed return per unit of contemporaneously completed ETH quote volume; the governed evaluator applies the frozen absolute-value tail test while retaining this sign for orientation."}
    - {fit_policy: stateless, input_fields: [btc_15m_log_return], operation: realized_volatility, output_field: btc_15m_realized_volatility_96, parameters: {window: 96}, rationale: "Local BTC volatility control over one day of completed 15m returns; evaluator usage is prior-only and excludes the current signal bar."}
  transformation_rationale: "Challenge accepted only in frozen form: the founder idea's outcome-responsive dynamic selection premise is rejected. BTCUSDT and ETHUSDT are preregistered before outcomes, with 15m bars chosen from the 60m horizon and the hypothesized delayed transmission process. Log returns provide scale-safe innovations. Quote-volume identities preserve the actual USD liquidity measurements needed to require all 15 constituent values to be present and nonnegative and each 15m sum to be at least USD 1,000,000. The signed ETH return-to-quote-volume ratio preserves both displacement magnitude input and orientation. Because the native operation set has no absolute-value or time-series percentile operation, the graph does not silently replace the frozen predictor with a z-score; absolute value and the prior-only 97.5% or 99% percentile are left to the governed evaluator. BTC realized volatility uses 96 completed 15m bars and must be lagged one completed bar by the evaluator so the signal bar is excluded. No targets or outcome metrics were consulted. ETHUSDT remains unadmitted and cannot execute until independently content-admitted."
  rejected_alternatives:
    - "Outcome-responsive or dynamically changing baskets: rejected because universe selection must be frozen before target evaluation."
    - "SOLUSDT as an additional predictor or control: rejected as unnecessary for the smallest causally sufficient basket and as adding admission and multiple-testing burden."
    - "Binance BTCUSDT and ETHUSDT panels: rejected to avoid cross-venue clock and microstructure differences; the frozen basket uses Bybit only."
    - "Raw close levels and raw cross-asset price ratios: rejected because differing price scales and persistent levels do not represent the specified short-horizon innovations."
    - "Simple returns: retained as a robustness alternative but rejected as the primary representation because log returns aggregate consistently across the four-bar 60m horizon."
    - "Fractional differentiation: rejected because the question concerns short-horizon return innovations rather than persistent price-level memory; no value of d is justified without diagnostics."
    - "Cross-sectional ranks: rejected because a two-instrument rank would discard displacement magnitude and alter the frozen predictor."
    - "Rolling z-score as a substitute for the frozen prior-only percentile: rejected because it would change the predictor. The native graph exposes the causal signed ratio; the governed evaluator must apply the preregistered absolute value and prior-only 97.5% or 99% percentile without outcome-based tuning."
    - "5m bars: rejected as unnecessarily noisy for the specified liquidity-transmission process and would change the frozen candidate timeframe."
    - "1h bars: rejected because they collapse the predictor and target horizon to the same interval and reduce timing resolution."
    - "Forward filling, interpolation, partial bars, and cross-gap calculations: rejected; any missing constituent, incomplete bar, or noncontiguous target path produces no observation."
  selection_data_boundary: metadata_predictors_only_no_targets
  outcome_data_consulted: false
