representation_plan: {"basket_members":[{"instrument":"ETHUSDT","legacy_groups":["stable"],"role":"primary","selection_rationale":"Primary asset named by the frozen question and residual-return target."},{"instrument":"BTCUSDT","legacy_groups":["stable"],"role":"predictor","selection_rationale":"Broad crypto return input required by both preregistered residualization variants."},{"instrument":"SOLUSDT","legacy_groups":["stable"],"role":"control","selection_rationale":"Second market control required to distinguish ETH-specific movement from broader large-cap movement."}],"candidate_key":"eth-relative-liquidity-reversal-6h-v1","instruments":["ETHUSDT","BTCUSDT","SOLUSDT"],"outcome_data_consulted":false,"rejected_alternatives":["BTCUSDT alone was rejected because it violates the frozen two-instrument minimum and cannot identify ETH residual returns.","ETHUSDT plus BTCUSDT was rejected because it omits the preregistered SOLUSDT control and cannot support the frozen BTC-and-SOL residualization rival.","A larger all-eligible or legacy-group basket was rejected as causally unnecessary and would add admission, missingness, and multiple-testing burden.","Price-level ratios and fractional differentiation were rejected because the hypothesis concerns finite six-hour returns rather than persistent price levels; log returns are scale-safe and exactly aligned to the stated predictor and target.","Rolling z-scores, realized-volatility scaling, and cross-sectional ranks were rejected because they would add unregistered windows or alter the frozen underperformance-and-liquidity-state question.","Funding, basis, and open-interest representations were rejected because they belong to distinct founder-idea branches and are not predictors in this candidate."],"resampling_policy":"left_closed_left_labeled_complete_bars","research_timeframe":"1h","schema_version":"adaptive-representation-plan-v1.0.0","selection_data_boundary":"metadata_predictors_only_no_targets","source_timeframe":"1m","transformation_rationale":"The founder's omnibus premise is not accepted: only the specific relative-price and declining-liquidity branch is retained. Complete 1m observations are aggregated into left-closed, left-labeled 1h bars, and every decision uses only six completed historical bars. Six-period log returns provide scale-safe cumulative returns for ETH and both controls. Six-period simple quote-volume change expresses the frozen declining-liquidity predictor without an outcome-selected normalization window. Contemporaneous quote_volume and volume are retained as actual liquidity measurements for every member; the USD floor is enforced on quote_volume. The preregistered train-only linear residualization against BTC and SOL is not expressible by the native transformation vocabulary, so the graph supplies its causal return inputs unchanged and leaves coefficient fitting to the governed train-only evaluator. ETHUSDT and SOLUSDT are catalog-visible but require content-bound admission before execution.","transformations":[{"fit_policy":"stateless","input_fields":["ETHUSDT__close"],"operation":"log_return","output_field":"eth_return_6h","parameters":{"periods":6},"rationale":"Scale-safe six-hour ETH return using only completed historical 1h closes."},{"fit_policy":"stateless","input_fields":["BTCUSDT__close"],"operation":"log_return","output_field":"btc_return_6h","parameters":{"periods":6},"rationale":"Six-hour BTC market-control return supplied to the governed residualization fit."},{"fit_policy":"stateless","input_fields":["SOLUSDT__close"],"operation":"log_return","output_field":"sol_return_6h","parameters":{"periods":6},"rationale":"Six-hour SOL control return supplied to the governed residualization fit."},{"fit_policy":"stateless","input_fields":["ETHUSDT__quote_volume"],"operation":"simple_return","output_field":"eth_quote_volume_change_6h","parameters":{"periods":6},"rationale":"Past-only proportional quote-volume change defining declining ETH liquidity over the same six-hour window."},{"fit_policy":"stateless","input_fields":["ETHUSDT__quote_volume"],"operation":"identity","output_field":"eth_quote_volume_usd","parameters":{},"rationale":"Actual ETH quote-volume measurement used to enforce the USD liquidity floor."},{"fit_policy":"stateless","input_fields":["BTCUSDT__quote_volume"],"operation":"identity","output_field":"btc_quote_volume_usd","parameters":{},"rationale":"Actual BTC quote-volume measurement used to enforce the USD liquidity floor."},{"fit_policy":"stateless","input_fields":["SOLUSDT__quote_volume"],"operation":"identity","output_field":"sol_quote_volume_usd","parameters":{},"rationale":"Actual SOL quote-volume measurement used to enforce the USD liquidity floor."},{"fit_policy":"stateless","input_fields":["ETHUSDT__volume"],"operation":"identity","output_field":"eth_base_volume","parameters":{},"rationale":"Retains the mandated companion liquidity measurement for completeness checks."},{"fit_policy":"stateless","input_fields":["BTCUSDT__volume"],"operation":"identity","output_field":"btc_base_volume","parameters":{},"rationale":"Retains the mandated companion liquidity measurement for completeness checks."},{"fit_policy":"stateless","input_fields":["SOLUSDT__volume"],"operation":"identity","output_field":"sol_base_volume","parameters":{},"rationale":"Retains the mandated companion liquidity measurement for completeness checks."}]}
