name: Implementation baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install check-jsonschema==0.33.3
      - name: Collect deterministic baseline
        run: |
          python scripts/implementation_baseline.py collect \
            --repository . \
            --output .baseline/implementation-baseline.json
          python scripts/implementation_baseline.py validate \
            .baseline/implementation-baseline.json
          check-jsonschema \
            --schemafile schemas/implementation-baseline-v1.schema.json \
            .baseline/implementation-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-baseline-${{ github.sha }}
          path: .baseline/implementation-baseline.json
          if-no-files-found: error
          retention-days: 30
