name: BT-001 contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [collection, exec, hypotheses, auxiliary, root-1, root-2, root-3, root-4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev-py311.lock
      - run: python -m pip install -r requirements/dev-py311.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/run_bt001_matrix.py ${{ matrix.shard }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements/dev-py311.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check scripts/run_bt001_matrix.py
      - run: >-
          python -m mypy --ignore-missing-imports
          src/bt/exec/observability/channels.py
          src/bt/research_data/jobs/daily_validation.py
          src/bt/research_data/live/liquidation_collector.py
          src/bt/risk/reject_codes.py
          scripts/run_bt001_matrix.py
