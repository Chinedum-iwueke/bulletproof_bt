[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bulletproof_bt"
version = "0.1.0"
description = "Event-driven, bar-by-bar backtesting scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<2.3",
  "pandas>=2.2,<3",
  "pyarrow>=23,<24",
  "matplotlib>=3.10,<4",
  "pyyaml>=6,<7",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=9,<10",
  "ruff>=0.12,<1",
  "mypy>=1.18,<2",
]

[project.scripts]
bt = "bt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
