# Default backtest engine config: safe, streaming-first, and overlay-friendly.
# NOTE: Top-level fee/slippage execution overrides are intentionally omitted.
# Use execution.profile=custom with execution.* override fields for custom execution behavior.
initial_cash: 100000.0
model: fixed_bps
execution_engine: auto        # classic | auto | fast_path; unsupported fast runs fall back safely

# Data loading and streaming controls.
data:
  mode: streaming               # default for dataset directories; single-file auto-routing still applies
  symbols_subset: null          # optional explicit symbol allowlist
  max_symbols: null             # optional cap after symbol filtering
  date_range: null              # optional window; may also be {start: ..., end: ...}
  row_limit_per_symbol: null    # optional per-symbol row cap
  chunksize: 50000              # streaming chunk size
  # timeframe: "15m"            # optional single HTF resample target override (1m,3m,5m,15m,30m,1h,4h,1d)

# Execution and fill-model controls.
execution:
  # profile: tier2              # tier1 | tier2 | tier3 | custom
  intrabar_mode: worst_case     # worst_case | best_case | midpoint
  spread_mode: fixed_bps        # none | fixed_bps | bar_range_proxy
  # spread_bps: 1.0             # only used when spread_mode=fixed_bps

  # Custom-only profile overrides (used only when execution.profile=custom):
  # maker_fee: 0.0
  # taker_fee: 0.0006
  # slippage_bps: 2.0
  # delay_bars: 1

# Risk sizing and margin guardrails.
risk:
  mode: equity_pct
  r_per_trade: 0.005
  max_positions: 5
  max_leverage: 1.0
  stop_resolution: safe         # safe | strict
  allow_legacy_proxy: false     # safe default: no silent fallback/proxy sizing
  hybrid_policy: wider          # wider | tighter
  margin_buffer_tier: 1         # 1 | 2 | 3
  slippage_k_proxy: 0.0
  min_stop_distance_pct: 0.001
  min_stop_distance: null
  # Risk-at-stop remains the primary sizing target. The per-symbol notional cap
  # is a separate tail/gap guard: it permits full 0.5%-R deployment for stops
  # around 1% or wider, while preventing tiny stops from creating multi-equity
  # exposure. Gross exposure remains bounded to unlevered account equity.
  max_notional_pct_equity: 0.5
  entry_notional_cap_buffer_pct: 0.20
  max_gross_notional_pct_equity: 1.0
  maintenance_free_margin_pct: 0.01
  qty_rounding: none            # none | floor | round
  # Perpetual-futures research must not continue through impossible margin
  # states. When mark-to-market free margin turns negative, force liquidation
  # and record it explicitly instead of letting the run survive silently.
  may_liquidate: true
  stop:
    mode: null                  # set to atr or legacy_proxy only in explicit overlays
    atr_indicator: atr
    atr_multiple: null

# Optional strategy-vs-benchmark tracking.
benchmark:
  enabled: false
  symbol: null
  price_field: close
  initial_equity: null
  fee_model: none

# Metrics/reconciliation settings.
metrics: {}

# Logging/artifact settings.
outputs:
  root_dir: outputs/runs
  jsonl: true
  # Flush buffered artifacts periodically, not every row. This preserves exact
  # CSV/JSONL contents while avoiding huge syscall overhead on long 1m runs.
  equity_flush_every: 5000
  trade_flush_every: 100

# Online entry-state enrichment. The default remains full so existing research
# artifacts keep funding/OI/mark/index/liquidation fields. Production daemon
# runs can set profile=minimal to keep causal OHLCV state only.
state_features:
  enabled: true
  profile: full

# Keep legacy HTF keys for compatibility with existing overlays.
htf_timeframes: ["5m", "15m", "1h"]
htf_strict: true
htf_resampler:
  timeframes: ["5m", "15m", "1h"]
  strict: true


# Optional audit harness. Disabled by default for near-zero overhead.
audit:
  enabled: false
  level: basic
  max_events_per_file: 5000
  determinism_check: false
  required_layers: []

# Strategy defaults to a deterministic baseline that runs on any dataset.
strategy:
  name: coinflip
  signal_conflict_policy: reject  # reject | first_wins | last_wins | net_out
  params: {}
  seed: 42
  p_trade: 0.10
  cooldown_bars: 1
  stop_atr_multiple: 2.0
  max_hold_bars: 60
