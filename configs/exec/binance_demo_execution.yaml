exec:
  mode: paper_broker
  startup_reconcile_required: true
  block_new_orders_until_reconciled: true

broker:
  venue: binance
  environment: demo
  symbols: [BTCUSDT]
  recv_window_ms: 5000
  request_timeout_ms: 4000
  max_retries: 3
  retry_backoff_ms: 250
  auth:
    api_key_env: BINANCE_DEMO_API_KEY
    api_secret_env: BINANCE_DEMO_API_SECRET

routing:
  allow_cancel: true
  allow_amend: true
  max_open_orders_per_symbol: 4

reconcile:
  enabled: true
  interval_seconds: 30
  policy: freeze_on_material
